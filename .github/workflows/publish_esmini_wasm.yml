name: Publish esmini WASM app
run-name: Publish esmini WASM from ${{ inputs.esmini_branch }}

on:
  workflow_dispatch:
    inputs:
      esmini_branch:
        description: Branch in esmini
        required: true
        default: master # Which branch to fall back to if no branch is provided
        type: string # Text input

permissions:
  contents: read

# Prevent publish jobs from running at the same time. A new job will not cancel the on-going job.
concurrency:
  group: publish-esmini-wasm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Fetch esmini prototype branch
        uses: actions/checkout@v6
        with:
          repository: slundel6/esmini
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the requested source
        env:
          ESMINI_BRANCH: ${{ inputs.esmini_branch }}
        run: |
          branch_ref="refs/remotes/origin/$ESMINI_BRANCH"
          if ! git check-ref-format "refs/heads/$ESMINI_BRANCH" ||
             ! git show-ref --verify --quiet "$branch_ref"; then
            echo "::error::Branch not found in slundel6/esmini."
            exit 1
          fi
          ESMINI_SHA=$(git rev-parse "$branch_ref^{commit}")
          echo "Building esmini commit $ESMINI_SHA on branch $ESMINI_BRANCH"
          git checkout --detach "$ESMINI_SHA"
          git submodule update --init

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bzip2 cmake ninja-build

      - name: Install Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.10
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.10

      - name: Build esminiJS
        working-directory: EnvironmentSimulator/Libraries/esminiJS
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./build.sh
          # Check that the paths exists, else the job stops
          test -s ../../Applications/esmini-wasm/index.html
          test -s ../../Applications/esmini-wasm/esmini.js
          test -s ../../Applications/esmini-wasm/resources/xosc/wasm-example.xosc
          test -s ../../Applications/esmini-wasm/resources/xodr/wasm-example.xodr
          test -s ../../Applications/esmini-wasm/resources/xosc/Catalogs/Vehicles/VehicleCatalog.xosc

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: EnvironmentSimulator/Applications/esmini-wasm

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
